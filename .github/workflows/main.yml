name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            echo "Test" >> /root/test.txt
            killall run.sh
            cd /var/www/Jass
            git pull origin main
            cd frontend/Jass
            npm ci
            npm run build
            cd ../..
            ./run.sh &
